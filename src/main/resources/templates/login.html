<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('Login')"></head>
<body>
<main class="card">
    <div th:replace="fragments :: logo"></div>
    <h1>Entrar</h1>
    <p class="subtitle">Informe seus dados para acessar</p>

    <div class="alert error" th:if="${param.error}">Usuário/email ou senha inválidos.</div>
    <div class="alert success" th:if="${param.logout}">Você saiu da sua conta.</div>
    <div class="alert success" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/login}" method="post" novalidate>
        <div class="field">
            <label for="username">Usuário ou email</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn">Entrar</button>
    </form>

    <div class="links">
        <a th:href="@{/recoverpassword}">Esqueci minha senha</a>
        <a th:href="@{/register}">Criar conta</a>
    </div>
</main>
</body>
</html>
