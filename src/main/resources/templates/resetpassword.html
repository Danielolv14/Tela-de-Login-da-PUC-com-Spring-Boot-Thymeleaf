<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('Nova senha')"></head>
<body>
<main class="card">
    <div th:replace="fragments :: logo"></div>
    <h1>Definir nova senha</h1>

    <div th:if="${invalid}">
        <div class="alert error">Link inválido ou expirado. Solicite uma nova recuperação.</div>
        <div class="links center"><a th:href="@{/recoverpassword}">Solicitar novo link</a></div>
    </div>

    <form th:unless="${invalid}" th:action="@{/resetpassword}" th:object="${form}" method="post" novalidate>
        <input type="hidden" th:field="*{token}">
        <div class="field">
            <label for="password">Nova senha (mín. 8, com letras e números)</label>
            <input type="password" id="password" th:field="*{password}" th:classappend="${#fields.hasErrors('password')} ? 'invalid'" autocomplete="new-password" autofocus>
            <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div class="field">
            <label for="confirmPassword">Confirmar senha</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'invalid'" autocomplete="new-password">
            <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>
        <button type="submit" class="btn">Redefinir senha</button>
    </form>

    <div class="links center" th:unless="${invalid}">
        <a th:href="@{/login}">← Voltar para o login</a>
    </div>
</main>
</body>
</html>
