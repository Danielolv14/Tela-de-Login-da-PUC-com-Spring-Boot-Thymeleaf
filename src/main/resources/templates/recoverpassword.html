<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments :: head('Recuperar senha')"></head>
<body>
<main class="card">
    <div th:replace="fragments :: logo"></div>
    <h1>Esqueceu a senha?</h1>
    <p class="subtitle">Sem problemas. Digite seu email e enviamos um link para você criar outra.</p>

    <div class="alert error" th:if="${error}" th:text="${error}"></div>
    <div class="alert success" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/recoverpassword}" method="post" novalidate>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required autofocus>
        </div>
        <button type="submit" class="btn">Enviar link</button>
    </form>

    <div class="links center">
        <a th:href="@{/login}">← Voltar para o login</a>
    </div>
</main>
</body>
</html>
